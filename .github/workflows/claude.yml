name: Claude

# 運用方針: GitHub 上での `@claude` コメント起動は禁止。
#  - 通常コメント（issue_comment / pull_request_review_comment）で起動すると、
#    リポジトリへの contents: write を持つ実行を「コメントできる人なら誰でも」起動でき、
#    標準運用（Claude GitHub Code Review / @claude review 原則禁止）と矛盾する。
#  - そのため自動トリガーは全て無効化し、リポジトリへ write 権限を持つ担当者が
#    手動 (workflow_dispatch) で明示的に実行したときだけ動作するようにする。
#  - usage credits / 有料 review が発生し得る自動起動は持たせない。
on:
  workflow_dispatch:

jobs:
  claude:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
